<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Alternatieve Inzet</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#12302b;--mute:#566b66;--line:#dce6e3;--brand:#0b6e5f;--brand-ink:#fff;--soft:#e2f2ee;--warn:#8a5a00;--warnbg:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#16262308;--card:#152522;--ink:#e8f3f0;--mute:#9fb5b0;--line:#27403b;--brand:#4cc9b0;--brand-ink:#06211c;--soft:#1b3a35;--warn:#ffd98a;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#152522;--ink:#e8f3f0;--mute:#9fb5b0;--line:#27403b;--brand:#4cc9b0;--brand-ink:#06211c;--soft:#1b3a35;--warn:#ffd98a;--warnbg:#3a2f12}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 6px}h2{font-size:1.1rem;margin:0 0 10px}p{margin:0 0 10px}
.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hero{background:var(--brand);color:var(--brand-ink);border:0}.hero .mute{color:inherit;opacity:.85}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat b{display:block;font-size:1.5rem}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;min-height:48px;font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);cursor:pointer;text-align:center}
.btn.sec{background:var(--soft);color:var(--ink)}.btn.small{display:inline-block;width:auto;min-height:40px;padding:8px 14px}
.hero .btn{background:var(--brand-ink);color:var(--brand)}
button:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
label{display:block;font-weight:600;margin:10px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);min-height:48px}
.err{color:#b3261e;font-size:.9rem;margin-top:4px}
@media (prefers-color-scheme:dark){.err{color:#ff9a92}}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:var(--brand-ink)}
.match{display:grid;grid-template-columns:1fr 64px 20px 64px 1fr;gap:6px;align-items:center;text-align:center;margin:12px 0}
.match input{text-align:center;padding:8px}.match span.t{font-weight:600;font-size:.95rem}
.badge{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--soft)}
.badge.w{background:var(--warnbg);color:var(--warn)}
.demo{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hist{border-top:1px solid var(--line);padding:12px 0}.hist:first-of-type{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:14px 4px;min-height:56px;cursor:pointer}
nav button[aria-current=page]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:16px;right:16px;bottom:80px;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:20}
.steps{padding-left:20px;margin:8px 0 0}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.opt button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;min-height:64px;font:inherit;cursor:pointer}
.opt button b{display:block;font-size:1.05rem}.opt button span{font-size:.85rem}
.opt button[aria-pressed=true]{border-color:var(--brand);background:var(--soft)}
.calc{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:12px}
.split{display:flex;justify-content:space-between;gap:8px}.sep{border-top:1px solid var(--line);margin:8px 0}
.you{background:var(--soft)}table{font-size:.9rem}th,td{padding:6px 4px;text-align:left}.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect}=React;
const html=htm.bind(React.createElement);
const KEY='alternatieve-inzet-v7',UNIT=1; // vast virtueel rekenbedrag per voorspelling
const eur=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const odd=n=>new Intl.NumberFormat('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fmtDate=(d,o)=>new Intl.DateTimeFormat('nl-NL',o||{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const parseAmt=s=>{const n=parseFloat(String(s).replace(',','.'));return isFinite(n)?Math.round(n*100)/100:NaN};
const r2=n=>Math.round(n*100)/100;
const fv=(S,d,r,y)=>{const n=y*12,i=r/1200;return i===0?S+d*n:S*Math.pow(1+i,n)+d*((Math.pow(1+i,n)-1)/i)};
const K=['H','D','A'],SH={H:'1',D:'X',A:'2'};
// Echte Champions League-wedstrijden (momentopname 14 okt. 2026, bron: Ziggo Sport/UEFA-programma, tijden CEST).
// Quoteringen zijn INDICATIEF (eigen schatting; alleen Feyenoord – Como volgt gepubliceerde marktindicaties), geen bookmakerdata.
const BASE=[['LASK','Liverpool',[6.5,5,1.45],'2026-10-14T18:45'],['Feyenoord','Como',[3.6,4,1.85],'2026-10-14T18:45'],['AS Roma','Real Madrid',[4,3.8,1.9],'2026-10-14T21:00'],['Aston Villa','Fenerbahçe',[1.7,4,4.8],'2026-10-14T21:00'],['Bodø/Glimt','Borussia Dortmund',[3.6,3.9,1.9],'2026-10-14T21:00'],['PSG','FC Barcelona',[2.2,3.6,3.1],'2026-10-20T21:00'],['Liverpool','Villarreal',[1.45,4.8,7],'2026-10-20T21:00'],['FC Porto','PSV',[2.5,3.3,2.8],'2026-10-20T21:00'],['Manchester City','AEK Athene',[1.2,7,13],'2026-10-20T21:00'],['Como','Manchester United',[3,3.4,2.3],'2026-10-21T18:45'],['Bayern München','Arsenal',[2.4,3.6,2.8],'2026-10-21T21:00'],['Real Betis','Feyenoord',[1.95,3.6,3.8],'2026-10-21T21:00'],['Real Madrid','RB Leipzig',[1.55,4.5,5.5],'2026-10-21T21:00'],['Inter','Shakhtar Donetsk',[1.3,5.5,9.5],'2026-10-21T21:00']];
const MATCHES=BASE.map(([h,a,o,t],i)=>({id:i,c:'Champions League',h,a,o,date:new Date(t+':00+02:00').toISOString()}));
const FRIENDS=[['Sanne',1.5],['Daan',1],['Lotte',0.6],['Bram',1.2]];
const rnd=x=>{const y=Math.sin(x)*10000;return y-Math.floor(y)};
const choose=(o,bias,seed)=>{const w=o.map(x=>Math.pow(1/x,bias)),q=rnd(seed)*w.reduce((a,b)=>a+b);let i=0,a=w[0];while(q>a&&i<2){i++;a+=w[i]}return K[i]};
const fpick=(fi,mid)=>choose(MATCHES[mid].o,FRIENDS[fi][1],mid*7+fi*13+1);
const lbl=(m,k)=>k==='H'?m.h:k==='A'?m.a:'Gelijkspel';
const EMPTY={round:1,preds:[],plan:{rate:2,pw:5}};
const load=()=>{try{const s=localStorage.getItem(KEY);return s?{...EMPTY,...JSON.parse(s)}:EMPTY}catch(e){return EMPTY}};

function App(){
  const [s,setS]=useState(load),[tab,setTab]=useState('home'),[toast,setToast]=useState('');
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},[s]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),4000);return()=>clearTimeout(t)},[toast]);
  const P=s.preds,done=P.filter(p=>p.res),saved=P.filter(p=>p.reg==='saved'),pend=done.filter(p=>p.opb>0&&!p.reg);
  const total=saved.reduce((a,p)=>a+p.amt,0),calc=r2(done.reduce((a,p)=>a+p.opb,0)),good=done.filter(p=>p.opb>0).length,open=r2(pend.reduce((a,p)=>a+p.opb,0));
  const A={s,setS,P,done,saved,pend,total,calc,good,open,setTab,
    lock:(m,k)=>{setS(x=>({...x,preds:[{mid:m.id,round:x.round,c:m.c,h:m.h,a:m.a,pick:k,odds:m.o[K.indexOf(k)],res:null,opb:0,reg:null,amt:0,savedAt:null},...x.preds]}));setToast('Voorspelling vastgelegd. Je kunt hem niet meer wijzigen.')},
    setResult:(p,res)=>{const opb=res===p.pick?r2(p.odds*UNIT):0;
      setS(x=>({...x,preds:x.preds.map(q=>q.mid===p.mid?{...q,res,opb}:q)}));
      setToast(opb>0?'Uitslag binnen: '+eur(opb)+' spaaropbouw.':'Deze keer geen opbouw. Je verliest niets.')},
    register:mode=>{const at=new Date().toISOString();setS(x=>({...x,preds:x.preds.map(q=>q.res&&q.opb>0&&!q.reg?{...q,reg:mode,amt:mode==='saved'?q.opb:0,savedAt:at}:q)}));
      setToast(mode==='saved'?'Spaaractie geregistreerd. Fijn dat je dit voor jezelf opzijzet.':'Geen probleem. Je kunt later altijd sparen.')},
    };
  return html`<div>
    <div className="demo" role="note">Echte Champions League-wedstrijden (momentopname 14 okt. 2026). Quoteringen zijn indicatief, vrienden zijn demo; geen echte geldtransacties.</div>
    ${tab==='home'&&html`<${Home} ...${A}/>`}${tab==='games'&&html`<${Games} ...${A}/>`}${tab==='rank'&&html`<${Rank} ...${A}/>`}${tab==='wealth'&&html`<${Wealth} ...${A}/>`}
    <nav aria-label="Hoofdmenu"><div>${[['home','Overzicht'],['games','Wedstrijden'],['rank','Ranglijst'],['wealth','Vermogen']].map(([k,l])=>html`<button key=${k} aria-current=${tab===k?'page':undefined} onClick=${()=>setTab(k)}>${l}</button>`)}</div></nav>
    ${toast&&html`<div className="toast" role="status">${toast}</div>`}
  </div>`;
}

function Pending({pend,open,register}){
  if(!pend.length)return null;
  return html`<div className="card"><h2>Nog te registreren: ${eur(open)}</h2>
    <p className="mute">Heb je dit bedrag overgemaakt naar je eigen spaarrekening? Alleen jouw melding telt; de app controleert dit niet bij een bank.</p>
    <button className="btn" onClick=${()=>register('saved')}>Ja, ${eur(open)} overgemaakt</button><div style=${{height:8}}/><button className="btn sec" onClick=${()=>register('skipped')}>Nu niet</button></div>`;
}

function Home(A){
  const {total,calc,good,done,P,open,setTab}=A;
  const st=p=>!p.res?'Wacht op uitslag':p.opb===0?'Geen opbouw':p.reg==='saved'?'Gespaard (zelf gemeld)':p.reg==='skipped'?'Overgeslagen':'Nog te registreren';
  return html`<main>
    <div className="card hero"><h1>Voorspel een wedstrijd. Goed voorspeld? Dan spaar je.</h1>
      <p>Kies wedstrijd voor wedstrijd, ook op de dag zelf. Geen inzet, geen verlies.</p>
      <button className="btn" onClick=${()=>setTab('games')}>Voorspel een wedstrijd</button></div>
    <${Pending} ...${A}/>
    <div className="stats">
      <div className="card stat"><span className="mute">Gespaard</span><b>${eur(total)}</b><span className="mute">zelf gemeld</span></div>
      <div className="card stat"><span className="mute">Berekende opbouw</span><b>${eur(calc)}</b><span className="mute">niet per se overgemaakt</span></div>
      <div className="card stat"><span className="mute">Juiste voorspellingen</span><b>${good} / ${done.length}</b></div>
      <div className="card stat"><span className="mute">Nog te registreren</span><b>${eur(open)}</b></div>
    </div>
    ${P.length===0?html`<div className="card"><h2>Zo werkt het</h2><ol className="steps"><li>Kies een wedstrijd en voorspel de uitkomst. De quotering ligt vooraf vast.</li><li>Na het vastleggen kun je je keuze niet meer wijzigen.</li><li>Goed: quotering × ${eur(UNIT)} aan spaaropbouw. Fout: € 0, je verliest niets.</li><li>Maak het bedrag over naar je eigen spaarrekening en registreer het hier.</li></ol></div>`
    :html`<div className="card"><h2>Geschiedenis</h2>${P.slice(0,12).map(p=>html`<div className="hist" key=${p.mid+'-'+p.round}><div className="row"><b>${p.h} – ${p.a}</b><span className=${'badge '+(p.res&&p.opb>0&&!p.reg?'w':'')}>${st(p)}</span></div>
      <div className="mute">Jij: ${lbl(p,p.pick)} (${odd(p.odds)})${p.res?' · Uitslag: '+lbl(p,p.res)+' · opbouw '+eur(p.opb):''}</div></div>`)}</div>`}
    <p className="mute">Bedragen zijn berekend of door jou gemeld, niet bank-geverifieerd. Er is geen inzet en er wordt niets uitgekeerd.</p>
  </main>`;
}

function Games(A){
  const {P,lock,setResult}=A;const [sel,setSel]=useState({}),[now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t)},[]);
  const list=MATCHES.filter(m=>new Date(m.date)>now||P.some(p=>p.mid===m.id));
  let last='';
  return html`<main><h1>Wedstrijden</h1>
    <p className="mute">Echte Champions League-wedstrijden, momentopname van 14 oktober 2026 (tijden in CEST). Quoteringen zijn indicatief en niet van een bookmaker. Rekenbedrag: ${eur(UNIT)} per voorspelling. Goed = quotering × ${eur(UNIT)}, fout = € 0. Voorspellen kan tot de aftrap.</p>
    <${Pending} ...${A}/>
    ${list.length===0&&html`<div className="card"><p>Er zijn geen aankomende wedstrijden meer in deze momentopname. Voor nieuwe wedstrijden is een live databron nodig.</p></div>`}
    ${list.map(m=>{const p=P.find(q=>q.mid===m.id),k=sel[m.id],ko=new Date(m.date).getTime(),open=now<ko,day=fmtDate(m.date,{weekday:'long',day:'numeric',month:'long'}),head=day!==last;last=day;return html`<div key=${m.id}>
      ${head&&html`<h2 style=${{margin:'18px 0 8px',textTransform:'capitalize'}}>${day}</h2>`}
      <div className="card"><div className="mute">${m.c} · ${fmtDate(m.date,{hour:'2-digit',minute:'2-digit'})}</div><h2>${m.h} – ${m.a}</h2>
      ${!p&&open&&html`<div><div className="opt" role="group" aria-label=${'Voorspelling '+m.h+' – '+m.a}>${K.map((q,j)=>html`<button key=${q} aria-pressed=${k===q} onClick=${()=>setSel(x=>({...x,[m.id]:q}))}><span>${lbl(m,q)}</span><b>${odd(m.o[j])}</b></button>`)}</div>
        ${k?html`<div><div className="calc">Goed: <b>${eur(m.o[K.indexOf(k)]*UNIT)}</b> spaaropbouw · Fout: € 0, geen verlies</div><button className="btn" onClick=${()=>lock(m,k)}>Voorspelling vastleggen</button></div>`:html`<p className="mute" style=${{margin:0}}>Kies een uitkomst. Het getal is de indicatieve quotering.</p>`}</div>`}
      ${p&&!p.res&&html`<div><p>Vastgelegd: <b>${lbl(p,p.pick)}</b> (${odd(p.odds)}). Je keuze kan niet meer wijzigen.</p>
        ${now>ko+110*60000?html`<div><p className="mute">Wat was de uitslag na 90 minuten? Vul de officiële uitslag in (zelf gemeld).</p><div className="row" style=${{justifyContent:'flex-start'}}>${K.map(q=>html`<button key=${q} className="btn small sec" onClick=${()=>setResult(p,q)}>${lbl(p,q)}</button>`)}</div></div>`:html`<p className="mute" style=${{margin:0}}>Na afloop van de wedstrijd kun je hier de uitslag invullen.</p>`}</div>`}
      ${p&&p.res&&html`<div><p style=${{marginBottom:4}}>Uitslag: <b>${lbl(p,p.res)}</b> · jij: ${lbl(p,p.pick)}</p><span className=${'badge '+(p.opb>0?'':'w')}>${p.opb>0?'Spaaropbouw '+eur(p.opb):'Geen opbouw, geen verlies'}</span></div>`}
      </div></div>`})}
  </main>`;
}

function Rank({s,done,calc,setTab}){
  if(!done.length)return html`<main><h1>Ranglijst</h1><div className="card"><p>Zodra je een wedstrijd hebt gespeeld, zie je hier hoe je het doet ten opzichte van je vrienden. Hun keuzes blijven verborgen tot je eigen voorspelling vaststaat.</p><button className="btn" onClick=${()=>setTab('games')}>Naar wedstrijden</button></div></main>`;
  const rows=[{name:'Jij',you:1,c:done.filter(p=>p.opb>0).length,t:calc},...FRIENDS.map(([name],fi)=>{let c=0,t=0;done.forEach(p=>{if(fpick(fi,p.mid)===p.res){c++;t+=p.odds*UNIT}});return{name,fi,c,t:r2(t)}})].sort((a,b)=>b.t-a.t||b.c-a.c);
  const cur=done.filter(p=>p.round===s.round);
  return html`<main><h1>Ranglijst</h1><p className="mute">Over alle wedstrijden die jij hebt gespeeld. Demo-vrienden; echte vrienden uitnodigen vraagt een backend. Opbouw is berekend, niet gestort.</p>
    <div className="card scroll"><table style=${{width:'100%',borderCollapse:'collapse'}}><thead><tr><th>#</th><th>Naam</th><th>Goed</th><th>Berekende opbouw</th></tr></thead><tbody>
      ${rows.map((x,i)=>html`<tr key=${x.name} className=${x.you?'you':''} style=${{borderTop:'1px solid var(--line)'}}><td>${i+1}</td><td>${x.name}</td><td>${x.c} / ${done.length}</td><td><b>${eur(x.t)}</b></td></tr>`)}</tbody></table></div>
    ${cur.length>0&&html`<div className="card scroll"><h2>Voorspellingen naast elkaar</h2><table style=${{width:'100%',borderCollapse:'collapse'}}><thead><tr><th>Wedstrijd</th><th>Uitslag</th><th>Jij</th>${FRIENDS.map(f=>html`<th key=${f[0]}>${f[0]}</th>`)}</tr></thead><tbody>
      ${cur.map(p=>html`<tr key=${p.mid} style=${{borderTop:'1px solid var(--line)'}}><td>${p.h} – ${p.a}</td><td>${SH[p.res]}</td><td>${p.pick===p.res?'✓ ':'✗ '}${SH[p.pick]}</td>${FRIENDS.map((f,fi)=>{const q=fpick(fi,p.mid);return html`<td key=${f[0]}>${q===p.res?'✓ ':'✗ '}${SH[q]}</td>`})}</tr>`)}</tbody></table>
      <p className="mute" style=${{marginTop:8}}>1 = thuis wint, X = gelijkspel, 2 = uit wint.</p></div>`}
  </main>`;
}

function Wealth({s,setS,total,saved}){
  const pl=s.plan,[f,setF]=useState({rate:String(pl.rate).replace('.',','),pw:String(pl.pw).replace('.',',')});
  const n={rate:parseAmt(f.rate),pw:parseAmt(f.pw)},ok=n.rate>=0&&n.rate<=15&&n.pw>=0&&n.pw<=1000;
  const ch=(k,v)=>{const g={...f,[k]:v};setF(g);const m={rate:parseAmt(g.rate),pw:parseAmt(g.pw)};if(m.rate>=0&&m.rate<=15&&m.pw>=0&&m.pw<=1000)setS(x=>({...x,plan:m}))};
  const r=ok?n.rate:pl.rate,d=(ok?n.pw:pl.pw)*52/12,now=Date.now();
  const interest=saved.reduce((a,p)=>a+p.amt*(Math.pow(1+r/100,Math.max(0,now-new Date(p.savedAt))/864e5/365)-1),0);
  const fld=(k,l)=>html`<div><label htmlFor=${'f'+k}>${l}</label><input id=${'f'+k} inputMode="decimal" value=${f[k]} onChange=${e=>ch(k,e.target.value)}/></div>`;
  return html`<main><h1>Vermogen</h1>
    <div className="card"><h2>Werkelijk gespaard</h2><b style=${{fontSize:'1.8rem'}}>${eur(total)}</b>
      <p className="mute">Totaal van de overschrijvingen die jij hebt geregistreerd. Zelf gemeld, niet bank-geverifieerd.</p>
      <div className="split"><span>Geschatte rente tot nu toe</span><b>${eur(interest)}</b></div>
      <p className="mute" style=${{marginTop:6}}>Schatting op basis van de ingestelde rente. Jouw bank kan een andere rente rekenen.</p></div>
    <div className="card"><h2>Prognose</h2>${fld('rate','Jaarlijkse rente van jouw spaarrekening (%)')}${fld('pw','Verwacht te sparen per week (€)')}
      ${!ok&&html`<div className="err" role="alert">Controleer de invoer: rente 0–15%, bedrag tot € 1.000.</div>`}
      <table style=${{width:'100%',marginTop:12,borderCollapse:'collapse'}}><thead><tr><th>Na</th><th>Vermogen</th><th>Stortingen</th><th>Rente</th></tr></thead><tbody>
        ${[1,3,5].map(y=>{const t=fv(total,d,r,y),dep=total+d*12*y;return html`<tr key=${y} style=${{borderTop:'1px solid var(--line)'}}><td>${y} jaar</td><td><b>${eur(t)}</b></td><td>${eur(dep)}</td><td>${eur(t-dep)}</td></tr>`})}</tbody></table>
      <p className="mute" style=${{marginTop:10}}>Dit is een prognose, geen gegarandeerd rendement. Rente wordt door je bank bepaald. Er is geen bankkoppeling.</p></div>
    <div className="card"><h2>Transacties</h2>${saved.length===0?html`<p className="mute">Nog geen geregistreerde spaaracties.</p>`
      :saved.map(p=>html`<div className="hist" key=${p.mid+'-'+p.round}><div className="row"><b>${eur(p.amt)}</b><span className="mute">${fmtDate(p.savedAt,{day:'numeric',month:'short',year:'numeric'})}</span></div><div className="mute">${p.h} – ${p.a} · zelf gemeld</div></div>`)}</div>
  </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
